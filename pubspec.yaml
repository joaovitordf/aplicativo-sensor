name: sensortech
description: "Aplicativo SensorEPI Remoto"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  dio: ^5.9.2
  path_provider: ^2.1.5
  flutter_dotenv: ^6.0.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  photo_view: ^0.15.0
  permission_handler: ^11.3.1
  flutter_local_notifications: ^17.2.4
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logoSensor.png
    - assets/logoMini.png
    - assets/appIcon.png
    - .env
